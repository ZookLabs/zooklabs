services:
  postgres-development:
    restart: always
    image: postgres:12.8-alpine
    environment:
      POSTGRES_USER: Bernard
      POSTGRES_PASSWORD: Nosey
      POSTGRES_DB: zooklabs
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready", "-d", "db_prod"]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 80s
