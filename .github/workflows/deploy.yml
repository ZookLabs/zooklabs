name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy-api:
    name: Deploy API to Deno Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.0

      - name: Deploy
        timeout-minutes: 5
        continue-on-error: true
        env:
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
        run: deno deploy --prod --no-wait

  deploy-web:
    name: Deploy Web App to Netlify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        run: corepack enable

      - name: Install web dependencies
        working-directory: apps/web
        run: yarn install --frozen-lockfile

      - name: Install visualiser dependencies
        working-directory: apps/visualiser
        run: yarn install --frozen-lockfile

      - name: Build web
        working-directory: apps/web
        run: yarn build

      - name: Build visualiser
        working-directory: apps/visualiser
        run: yarn build

      - name: Copy visualiser into web build
        run: |
          cp apps/visualiser/dist/index.html apps/web/build/visualiser.html
          rsync -a --exclude='index.html' apps/visualiser/dist/ apps/web/build/

      - name: Deploy to Netlify
        working-directory: apps/web
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx netlify-cli deploy --dir=build --prod
